properties:
  template:
    volumes:
    - name: webui-data-workflow
      storageType: AzureFile
      storageName: webui-data-workflow
    containers:
    - name: wealth-management-workflow
      image: wmagentacr-hmf9f2atgjd6a5ce.azurecr.io/wealth-management-workflow:v1
      resources:
        cpu: 1.0
        memory: 2Gi
      env:
      - name: OPENAI_API_BASE_URL
        value: https://a2a-router.livelybay-96634f40.eastus2.azurecontainerapps.io/v1
      - name: OPENAI_API_KEY
        value: wm-router-2026-secret
      - name: WEBUI_NAME
        value: Wealth Management
      - name: ENABLE_SIGNUP
        value: "true"
      - name: DEFAULT_MODELS
        value: router
      volumeMounts:
      - volumeName: webui-data-workflow
        mountPath: /app/backend/data/uploads
